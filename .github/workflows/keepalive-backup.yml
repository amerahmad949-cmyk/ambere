name: Supabase keep-alive & weekly backup

on:
  schedule:
    - cron: "17 5 * * *"   # every day 05:17 UTC (08:17 Jordan) — keep the database awake
    - cron: "0 6 * * 5"    # every Friday 06:00 UTC (09:00 Jordan) — send backup to Telegram
  workflow_dispatch:
    inputs:
      backup:
        description: "Send a backup to Telegram now"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  keepalive:
    runs-on: ubuntu-24.04
    steps:
      - name: Ping Supabase
        env:
          RAW_URL: ${{ secrets.SUPABASE_URL }}
          RAW_KEY: ${{ secrets.SUPABASE_PUBLISHABLE_KEY }}
        run: |
          set -euo pipefail
          # clean up accidental spaces / line breaks / trailing slash
          URL="$(printf '%s' "$RAW_URL" | tr -d '[:space:]')"; URL="${URL%/}"
          KEY="$(printf '%s' "$RAW_KEY" | tr -d '[:space:]')"
          [ -n "$URL" ] || { echo "::error::Secret SUPABASE_URL is empty or missing (check the exact name)"; exit 1; }
          [ -n "$KEY" ] || { echo "::error::Secret SUPABASE_PUBLISHABLE_KEY is empty or missing (check the exact name)"; exit 1; }
          case "$URL" in https://*.supabase.co) ;; *) echo "::error::SUPABASE_URL must look like https://xxxx.supabase.co (got ${#URL} chars)"; exit 1;; esac
          code=$(curl -sS -o resp.txt -w '%{http_code}' --retry 3 --retry-delay 10 -X POST "$URL/rest/v1/rpc/ping" \
            -H "apikey: $KEY" -H "Content-Type: application/json" -d '{}')
          echo "HTTP $code: $(cat resp.txt)"
          [ "$code" = "200" ] || { echo "::error::Ping failed with HTTP $code"; exit 1; }
          echo "Supabase is awake ✅"

  backup:
    if: github.event.schedule == '0 6 * * 5' || (github.event_name == 'workflow_dispatch' && inputs.backup)
    needs: keepalive
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Export bookings and send to Telegram
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python3 scripts/backup.py
